# Google Cloud Build -> Cloud Run deployment for Jack Smyth's Agent-Ready Home + Wet Lab
# Deploy in Sydney (australia-southeast1) with:
#   gcloud builds submit --config=cloudbuild.yaml --substitutions=_REGION=australia-southeast1,_SERVICE=jack-smyth-home
substitutions:
  _REGION: australia-southeast1
  _SERVICE: jack-smyth-home

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/${_SERVICE}:$BUILD_ID
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/${_SERVICE}:$BUILD_ID

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=gcr.io/$PROJECT_ID/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=5

images:
  - gcr.io/$PROJECT_ID/${_SERVICE}:$BUILD_ID
