name: Keep Cloud Run Warm (TTFB Guard)

on:
  schedule:
    # Every 15 minutes during AU waking hours (07:00–22:59 AEST / 21:00–12:59 UTC)
    - cron: "*/15 21-23,0-12 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Warm jacksmyth.fyi Cloud Run instance
        run: |
          STATUS=$(curl -sS -o /dev/null -w "%{http_code} %{time_total}s" https://jacksmyth.fyi/api/healthz)
          echo "Healthz ping: $STATUS"
          case "$STATUS" in
            200*) exit 0 ;;
            *) exit 1 ;;
          esac
